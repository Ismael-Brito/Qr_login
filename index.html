<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectando...</title>

  <script>

    async function redirecionar() {

      const query = window.location.search;

      if (!query) {
        document.body.innerHTML = "QR inválido";
        return;
      }

      const isPrivate = host => /^(10\.|192\.168\.)/.test(host);
      const urls = [
        "http://168.196.212.178:8080/indexLaboratorio.jsp",
        "http://192.168.2.249:8080/indexLaboratorio.jsp"
        // "http://168.196.212.178:8080/loginAtendimento.action" + query,
        // "http://192.168.2.249:8080/loginAtendimento.action" + query
      ].filter(u => {
        try {
          return !isPrivate(new URL(u).hostname) || location.hostname.match(/^192\.168\./);
        } catch { return true; }
      });
      
      const destino = await tentarUrls(urls, 2500);
      console.log(destino);
      if (destino) {
        document.body.innerHTML = "Conectando ao servidor...";
        window.location.href = destino;
      } else {
        document.body.innerHTML = "Nenhum servidor disponível";
      }
    }


    // testa se respondeu algo
    function testarUrl(url, timeout) {
  return new Promise(resolve => {
    const controller = new AbortController();

    const timer = setTimeout(() => {
      controller.abort();
      resolve(false);
    }, timeout);

    fetch(url, {
      method: "GET",
      cache: "no-store",
      signal: controller.signal
    })
      .then(response => {
        clearTimeout(timer);

        // Só considera sucesso se realmente respondeu OK
        resolve(response.ok || response.type === "opaque");
      })
      .catch(err => {
        clearTimeout(timer);
        console.log("Erro em", url, err);
        resolve(false);
      });
  });
}


    // tenta na ordem
    async function tentarUrls(urls, timeout) {

      for (const url of urls) {
        const ok = await testarUrl(url, timeout);

        if (ok) {
          console.log("Funcionou:", url);
          return url;
        }

        console.log("Falhou:", url);
      }

      return null;
    }

    redirecionar();

  </script>
</head>

<body style="font-family:Arial;text-align:center;margin-top:40px">
  Carregando Resultado...
</body>

</html>
