<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conectando...</title>

<script>
function testarInterno(url){
        try {
    const response = await fetch(url, { method: "GET" });

    if (response.status === 200) {
      console.log("✅ Site online (200)");
        return true;
    } else {
      console.log("⚠️ Status:", response.status);
        return false;
    }

  } catch (err) {
    console.log("❌ Site offline ou bloqueado por CORS");
  }
}

async function redirecionar(){

    const query = window.location.search;

    if(!query){
        document.body.innerHTML = "QR inválido";
        return;
    }

    const interno = "http://192.168.2.249:8080/";
    const externo = "http://168.196.212.178:8080/";

    const dentro = await testarInterno("http://192.168.2.249:8080/WhebWS/");

    let destino;

    if(dentro){
        destino = interno + "loginAtendimento.action" + query;
    }else{
        destino = externo + "loginAtendimento.action" + query;
    }

    window.location.replace(destino);
}

redirecionar();
</script>
